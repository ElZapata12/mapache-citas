# Base de datos para desarrollo. Uso:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: mapache-db
    environment:
      POSTGRES_DB: mapache
      POSTGRES_USER: mapache
      POSTGRES_PASSWORD: mapache
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  datos_postgres:
